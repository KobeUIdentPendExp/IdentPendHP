    <h2 class="page-title">Webots 環境設定 Q&A (Windows版)</h2>
    <p class="note" style="text-align: center; margin-bottom:30px;">Windows環境でのWebots利用時に発生しやすい問題と、その解決策をまとめています。</p>

    <div class="phase" id="qa-win-msvc-runtime">
        <h3>起動・実行時エラー</h3>
        <h4>Q2: Webots起動時やC/C++コントローラ実行時に「MSVCPXXX.dllが見つからない」等のランタイムエラーが表示されます。</h4>
        <div class="step">
            <strong>A. 必要なMicrosoft Visual C++ Redistributableがインストールされていないか、バージョンが古い可能性があります。</strong>
            <ul>
                <li>Webotsのバージョンに対応するVisual C++ RedistributableパッケージをMicrosoftの公式サイトからダウンロードし、インストールしてください。通常、Webotsのドキュメントやリリースノートに、推奨されるバージョン（例：「Visual Studio 2015, 2017, 2019, and 2022 用の Microsoft Visual C++ 再頒布可能パッケージ」など）が記載されています。</li>
                <li>x64版とx86版の両方が必要な場合があるので、両方インストールしてみるのも有効です。</li>
            </ul>
        </div>
        <div class="confirmation">インストール後、PCを再起動してから再度Webotsの動作を確認してください。</div>
    </div>
    <div class="phase" id="qa-win-firewall">

            <strong>A. WindowsのファイアウォールやインストールされているアンチウイルスソフトがWebotsの通信をブロックしている可能性があります。</strong>

                <li><strong>Windows Defender ファイアウォールの設定:</strong>

                        <li>「参照...」からWebotsの実行ファイル（通常は <span class="code">C:\Program Files\Webots\msys64\mingw64\bin\webots.exe</span> や <span class="code">webots-bin.exe</span>）を選択し、追加します。</li>
                        <li>追加されたWebotsの項目で、「プライベート」および「パブリック」のチェックボックスをオンにします。</li>
                    </ol>
                </li>
                <li><strong>サードパーティ製セキュリティソフト:</strong> 利用しているアンチウイルスソフトやファイアウォールソフトのマニュアルを参照し、Webotsの実行ファイルや使用するポート番号を例外として登録（許可リストに追加）してください。一時的に無効化して問題が解決するか確認することも切り分けの一つですが、セキュリティリスクを十分に理解した上で実施してください。</li>
            </ul>
        </div> -->
    </div>
